server:
  port: 8084
  servlet:
    context-path: /api

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://localhost:3306/coffeeshop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

services:
  menu:
    url: http://localhost:8082/api
  promotion:
    url: http://localhost:8083/api
  payment:
    url: http://localhost:8085/api

internal:
  service-token: coffee-internal-secret-2024

feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000

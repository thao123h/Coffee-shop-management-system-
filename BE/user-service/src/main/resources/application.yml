server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/coffeeshop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: hYBBOPwzM2+qj25Zdr8Dxe9adn12JCTwMixoLZMfBC4=
    expiration-ms: 86400000
